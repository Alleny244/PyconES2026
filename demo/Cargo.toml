[package]
name = "arrowbridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "arrowbridge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
pyo3-arrow = "0.20"
# Must match the arrow version pyo3-arrow is built against, or the
# DataType / ArrayRef types are distinct and will not unify.
arrow = { version = "59.3", features = ["ffi"] }
numpy = "0.30"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
